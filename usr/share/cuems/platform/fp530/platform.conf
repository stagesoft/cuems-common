#
# Maxtang SXC-FP530 (AMD Ryzen Embedded R2314). Read 2026-11-26.
cpu_model=\bR2314\b
gpu_pci_id=1002:15d8
kernel_params=
# ethernet0 is the lower-addressed of the two wired ports. The addresses
# themselves differ between units, so they are not written here.
ethernet_order=ascending
analog_codec=ALC897
# Two HD Audio controllers take cards 0 and 1; the kernel refuses USB audio at 1.
usb_audio_index=2
gpu_pin=true
firmware=firmware-amd-graphics firmware-misc-nonfree firmware-realtek firmware-iwlwifi firmware-sof-signed
vram_mb=2048
tpm=present
manual=HDMI HPD Lock enabled on all four ports (connect screens before power-on)
manual=AC Loss Control: Always On (test it by cutting the power)
manual=Wake on LAN enabled
manual=Both coin cells fitted (JBAT and JBAT_MCU)
accepted=false
