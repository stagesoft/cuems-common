#
# Intel N97 mini PC (board OAI-N97H3 6C). Read 2026-11-26.
cpu_model=\bN97\b
gpu_pci_id=8086:46d1
kernel_params=
# ethernet0 is the higher-addressed of the two wired ports (the cabled one).
ethernet_order=descending
analog_codec=ALC897
hda_index=0
usb_audio_index=1
gpu_pin=false
firmware=firmware-misc-nonfree firmware-realtek firmware-iwlwifi firmware-sof-signed intel-microcode
aperture_mb=1024
secure_boot=off
tpm=present
manual=GTT size 8 MB
manual=Restore on AC power loss: Power On (test it by cutting the power)
manual=ErP/EuP disabled and Wake on LAN enabled (test: poweroff, then a magic packet)
manual=Halt on errors / wait for F1: disabled
manual=Boot order: internal disk first, network boot disabled
manual=Administrator password set and recorded first
accepted=false
