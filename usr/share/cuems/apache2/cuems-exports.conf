#
# Project exports (1amfwm7kana): serves /var/lib/cuems/exports at /exports on
# both vhosts (server scope), so the zip that cuems-editor writes there reaches
# the browser. The folder is created and cleaned by
# /usr/lib/tmpfiles.d/cuems-exports.conf; it is outside the DocumentRoot on
# purpose, so the hand-placed /var/www/.htaccess (FallbackResource) never
# applies and a missing zip answers 404, not index.html.
#
# NOT a conffile: it ships under /usr/share, is symlinked into
# /etc/apache2/conf-available/ and enabled by the postinst (a2enconf), and the
# prerm undoes both. An upgrade therefore always replaces it, and a downgrade
# can remove it. cuems-editor refuses to export unless
# /etc/apache2/conf-enabled/cuems-exports.conf exists.
#
# /exports is the ONE URL prefix for downloads and this file the one place
# where a general (per-user) access control is to be added later, without
# touching the vhosts, the editor or the folder. Today it has the same
# boundary as the UI: no credentials.
Alias /exports /var/lib/cuems/exports

<Directory /var/lib/cuems/exports>
    Options -Indexes
    AllowOverride None
    Require all granted
    # A zip still being written is `.<name>.<random>.part` (mode 0600): never served.
    <FilesMatch "\.part$">
        Require all denied
    </FilesMatch>
</Directory>
