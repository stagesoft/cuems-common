#
# Project exports (1amfwm7kana): the folder cuems-editor writes zips to, served
# at /exports by /usr/share/cuems/apache2/cuems-exports.conf. Created here (the
# editor never creates it) and cleaned by age: a file not touched for one day
# is removed by the stock systemd-tmpfiles-clean timer, so a zip lives one to
# two days. Under the cuems home (not /var/www) because tmpfiles refuses to
# create a folder below a parent owned by a non-root user that is not the
# folder's owner.
d /var/lib/cuems/exports 0755 cuems cuems 1d
