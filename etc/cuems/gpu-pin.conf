#
# GPU clock pin (869eq54nj).
#
# Read by /usr/lib/cuems/bin/cuems-gpu-pin (ExecStart of cuems-gpu-pin.service).
# SHELL syntax — `key=value`, no spaces around `=` — because the reader is a
# shell script that sources this file. Note /etc/cuems/power-bridge.conf uses
# `key = value` instead; that one is parsed by Python, this one is sourced.
#
# WHAT THIS TURNS ON
#
#   enabled=true makes the host force its AMD GPU's DPM level to `high` at every
#   boot, on allow-listed hardware only (currently 1002:15d8, Picasso — the
#   Maxtang FP530). On any other host the unit is a logged no-op whatever this
#   says.
#
# WHY YOU WOULD WANT IT
#
#   On the FP530, sustained multi-4K decode collapses amdgpu's DPM to
#   ~210-277 MHz after the first heavy rung per boot and only a reboot restores
#   it — a video node that quietly loses ~2.3x of its GPU clock mid-show.
#   Pinning `high` rescues it.
#
# WHAT IT COSTS
#
#   ~+8 C. Measured on the bench: plateau 76.0 C at ~28 C ambient, no creep past
#   that step. The hot-ambient soak that qualifies this for a real venue is
#   Plans/2026-09-02-g5-pin-high-mechanism.md step 9 — until it passes, this
#   stays false everywhere except the test rig.
#
# WHY IT SHIPS false
#
#   cuems-common installs on every CUEMS host. A fleet-wide upgrade for an
#   unrelated fix must not start pinning clocks, and adding +8 C, on an AMD box
#   nobody has soaked. Same reasoning as enabled= in cluster-poweroff.conf.
#
# NOTE ON UPGRADES
#
#   This is a dpkg conffile. Once you change it, dpkg keeps YOUR version on
#   every future non-interactive upgrade — which is the intended per-host
#   behaviour, and the same deal as cluster-poweroff.conf.
#
# TO TURN IT OFF ON A RUNNING BOX without waiting for a reboot, also write
# `auto` to power_dpm_force_performance_level under each pinned card:
#   for f in /sys/class/drm/card*/device/power_dpm_force_performance_level; do
#       echo auto | sudo tee "$f"; done

enabled=false

# DPM level to force. `high` is the measured mitigation; `auto` is the stock
# behaviour. Remember `high` is a CEILING, not a floor: the SMU still bounds the
# clock by the package power budget (550-985 MHz under load on the FP530), so
# never write a test that asserts a minimum clock while pinned.
level=high
