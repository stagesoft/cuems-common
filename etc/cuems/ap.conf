#
# CUEMS controller fallback-AP network parameters.
# Used when bond0 fails to obtain an upstream DHCP lease and the
# controller becomes the network's AP + DHCP source.
#
# Source of truth — if you change these, also update:
#   /etc/dhcp/dhclient.conf        (fallback lease fixed-address — operator-managed,
#                                   not shipped by cuems-common)
#   /etc/dhcp/dhcpd.conf           (server-identifier, subnet, range, routers)
#   /usr/lib/cuems/bin/check-ip.sh sources this file (canonical consumer)
AP_GATEWAY=192.168.6.1
AP_NETMASK=255.255.255.0
AP_SUBNET=192.168.6.0/24
AP_RANGE_START=192.168.6.11
AP_RANGE_END=192.168.6.100
