#
# Orderly cluster power-off + boot display confirmation.
#
# Read by /usr/bin/cuems-cluster-poweroff (ExecStop of
# cuems-cluster-poweroff.service) and /usr/bin/cuems-displays-on. SHELL syntax —
# `key=value`, no spaces around `=` — because both readers are shell scripts that
# source this file. Note that /etc/cuems/power-bridge.conf uses `key = value`
# instead; that one is parsed by Python, this one is sourced by bash.
#
# WHAT THIS TURNS ON
#
#   enabled=true gives the host two behaviours:
#     * power button (or any `systemctl poweroff`) => projectors OFF, then the
#       cluster node(s) OFF and confirmed down, then the controller powers off.
#     * boot => the projectors are re-commanded ON until they confirm, but ONLY
#       if /etc/cuems/power-bridge.conf also has
#       `projector_power_on_on_start = true`. Both switches must agree.
#
# WHY IT SHIPS DISABLED
#
#   cuems-common is installed identically on every CUEMS host. Several sites have
#   real projector fleets configured that are deliberately left dark, and sites
#   with a Shelly already get an orderly shutdown through the bridge's POST
#   /shutdown. Shipping this on by default would change those venues' behaviour
#   on a routine package upgrade, with nobody present. So it is opt-in per box.
#
# This is also the single kill switch: enabled=false disables BOTH units with no
# reboot and no systemctl action.

enabled=false

# --- orderly power-off -----------------------------------------------------
# Should the controller power the cluster NODES down too, or only the displays
# and itself? true (the default) keeps the behaviour every site had before this
# knob existed. Set false where the operators power the nodes by hand, or where
# a node must stay up across a controller shutdown.
#
# Why it exists: with no knob, "displays off but leave the nodes alone" could
# only be expressed by NOT authorizing the controller's key on the node, i.e. as
# an SSH authentication failure. That is invisible in config, reads as a fault in
# the journal, silently reverts the day someone installs the key, and costs the
# full node_wait_s below on every single power-off. Sala1 at Castillo Medina del
# Campo is the site that needed this (2026-08-07).
nodes_off=true

# Seconds to wait for the cluster node(s) to actually go off the network after
# the SSH poweroff. Reached only when a node is stuck; a node that is already
# down is detected in one liveness pass and never waited for. Ignored entirely
# when nodes_off=false.
node_wait_s=120

# Hard bound on the whole PJLink display power-off stage, all devices together
# (they are commanded concurrently, so this does not scale with device count).
# MEASURED against an unroutable projector on test2, 2026-08-06: a status query
# costs one projector_command_timeout_s (5s, no retry) and the power-off costs
# 3 attempts plus 1s+3s backoff = 19s, so the worst reachable case is ~24s. 25
# left one second of margin, which would truncate the stage on any jitter and
# lose its log; 45 gives real headroom while still bounding a poweroff.
projector_timeout_s=45

# --- boot display confirmation ---------------------------------------------
# First check this many seconds after the bridge starts — long enough to be past
# a typical lamp cooldown, so the first retry is not wasted into an ERR3.
displays_on_first_delay_s=60
displays_on_interval_s=30
displays_on_max_tries=20

# --- paths (rarely changed) ------------------------------------------------
# The cuems-power-bridge virtualenv interpreter. Both scripts drive the bridge's
# own PJLink/SSH/reachability code through it, so no protocol logic is duplicated.
#
# cuems-power-bridge is a SUGGESTS of cuems-common, never a Depends: this feature
# is controller-only and opt-in, so it must not become a mandatory dependency of
# the package every node installs. If this interpreter is missing, both scripts
# log one ERROR and exit 0 without touching anything — a host with no bridge is a
# supported configuration, not a fault.
venv_python=/usr/lib/cuems/bin/python3
bridge_url=http://127.0.0.1:8478
