# System-wide ALSA configuration
# Card order pinned in /etc/modprobe.d/alsa-card-order.conf
#
# Hardware:
#   hw:PCH,3  = HDMI 0 (digital)
#   hw:PCH,7  = HDMI 1 (digital)
#   hw:PCH,8  = HDMI 2 (digital)
#   hw:PCH,9  = HDMI 3 (phantom — no physical jack, excluded)
#   hw:HID,0  = USB Audio (analog stereo jack)
#
# JACK runs on multi_hdmi (6ch, same clock).
# USB audio is bridged into JACK via alsa_out.

pcm.multi_hdmi {
    type multi

    slaves {
        a { pcm "hw:PCH,3" channels 2 }
        b { pcm "hw:PCH,7" channels 2 }
        c { pcm "hw:PCH,8" channels 2 }
    }

    bindings {
        0 { slave a channel 0 }
        1 { slave a channel 1 }
        2 { slave b channel 0 }
        3 { slave b channel 1 }
        4 { slave c channel 0 }
        5 { slave c channel 1 }
    }
}

pcm.hdmi_all {
    type plug
    slave.pcm "multi_hdmi"
}
