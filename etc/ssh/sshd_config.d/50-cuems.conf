#
# CUEMS sshd hardening drop-in.
# Recovery from a lockout (lost key, etc.): log in at the physical TTY
# console using the operator account documented in
# /usr/share/doc/cuems-common/default-credentials.md.

# Authentication: pubkey only, no root login, no passwords over SSH
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Hygiene
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PrintMotd no
