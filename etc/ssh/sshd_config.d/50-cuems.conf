#
# CUEMS sshd hardening drop-in.
# Recovery from a lockout (lost key, etc.): log in at the physical TTY
# console using the operator account documented in
# /usr/share/doc/cuems-common/default-credentials.md.

# Authentication: pubkey only, no root login, no passwords over SSH
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Hygiene
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
# Forwarding exists for one use: jumping through a controller to one of its
# nodes (ssh -J). Local forwarding only, and only to port 22 of the node
# addresses on the cluster link. PermitOpen takes no address range, so each is
# written out.
AllowTcpForwarding local
PermitOpen 169.254.0.11:22 169.254.0.12:22 169.254.0.13:22 169.254.0.14:22 169.254.0.15:22 169.254.0.16:22 169.254.0.17:22 169.254.0.18:22 169.254.0.19:22 169.254.0.20:22 169.254.0.21:22 169.254.0.22:22 169.254.0.23:22 169.254.0.24:22 169.254.0.25:22 169.254.0.26:22
PrintMotd no
