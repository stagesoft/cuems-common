<IfModule mod_ssl.c>
	<VirtualHost *:443>
		# The ServerName directive sets the request scheme, hostname and port that
		# the server uses to identify itself. This is used when creating
		# redirection URLs. In the context of virtual hosts, the ServerName
		# specifies what hostname must appear in the request's Host: header to
		# match this virtual host. For the default virtual host (this file) this
		# value is not decisive as it is used as a last resort host regardless.
		# However, you must set it for any further virtual host explicitly.
		#ServerName www.example.com

		ServerAdmin webmaster@localhost
		DocumentRoot /var/www/
	#	LogLevel debug
		

		<Directory "/var/www">
        	DirectoryIndex index.html
                AllowOverride All
                Order allow,deny
                Allow from all
                # The SPA's unhashed runtime files must always be revalidated: a tab
        # kept index.html (and the i18n json it loads) from the browser cache
        # for hours after a UI deploy and ran an old bundle. The hashed
        # bundles themselves are immutable and may be cached. Guarded so a
        # host without mod_headers still starts (postinst enables it).
        <IfModule headers_module>
            <FilesMatch "^(index\.html|.*\.json)$">
                Header set Cache-Control "no-cache, must-revalidate"
            </FilesMatch>
        </IfModule>
        </Directory>


		#LogLevel info ssl:warn
		
		#websockets

		ProxyPass "/realtime" "ws://127.0.0.1:9190/"
		ProxyPass "/upload" "ws://127.0.0.1:9092/upload"
			
		# needed to proxyPass query strings
		RewriteEngine ON
		RewriteCond %{QUERY_STRING} uri=(.*)$
		RewriteRule ^/ws ws://127.0.0.1:9092/?session=%1 [P]
		ProxyPass "/ws" "ws://127.0.0.1:9092/"




		ErrorLog ${APACHE_LOG_DIR}/error.log
		CustomLog ${APACHE_LOG_DIR}/access.log combined

		# For most configuration files from conf-available/, which are
		# enabled or disabled at a global level, it is possible to
		# include a line for only one particular virtual host. For example the
		# following line enables the CGI configuration for this host only
		# after it has been globally disabled with "a2disconf".
		#Include conf-available/serve-cgi-bin.conf

		# SSL Configuration
		SSLEngine on
		ServerName cuems.local
		ServerAlias controller.local
		SSLCertificateFile      /etc/ssl/certs/apache-selfsigned.crt
		SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key

	</VirtualHost>
</IfModule>
