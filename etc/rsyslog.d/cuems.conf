# CUEMS rsyslog rules. Drop-in (pulled in by the stock rsyslog.conf via
# `$IncludeConfig /etc/rsyslog.d/*.conf`) so we never have to divert rsyslog's
# own conffile. Routes the CUEMS local facilities to a dedicated log.
local0.*		/var/log/cuems.log
local1.*		/var/log/cuems.log
local2.*		/var/log/cuems.log
local3.*		/var/log/cuems.log
local4.*		/var/log/cuems.log
