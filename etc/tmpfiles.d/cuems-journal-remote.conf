# systemd-journal-remote's working directory on the CUEMS controller.
# The package's own postinst creates this on first install; we ship a
# tmpfiles rule too so a fresh master cannot race the daemon and so
# ownership is auto-asserted on every boot (covers cloned-host cases
# where the dir may have been inherited with wrong perms).
d /var/log/journal/remote 0755 systemd-journal-remote systemd-journal -
