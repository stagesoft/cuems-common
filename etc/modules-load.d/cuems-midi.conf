#
# ALSA sequencer modules required for MTC I/O via rtmidi.
# The ControllerEngine opens "Midi Through Port-0" (provided by snd-seq-dummy)
# to broadcast MTC; without these, rtmidi throws RtMidiError at engine init.
# Historically loaded on-demand by the kernel; make it explicit so boot order
# cannot race the engine.
snd-seq
snd-seq-dummy
