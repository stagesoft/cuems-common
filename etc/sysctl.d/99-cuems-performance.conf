#
# CUEMS Performance Tuning
# These settings optimize the system for CUEMS operation

# Network performance
net.core.somaxconn = 1024
net.core.netdev_max_backlog = 5000
net.unix.max_dgram_qlen = 1000

# Memory management
vm.swappiness = 10
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Kernel performance
kernel.sched_autogroup_enabled = 0
kernel.sched_migration_cost_ns = 5000000

# File system optimizations
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288

# No forwarding: nothing this package ships routes between interfaces, and with
# 1 a client of the WiFi AP is routed into the venue's LAN. A site that needs
# forwarding sets it in its own file under /etc/sysctl.d/ whose name sorts AFTER
# this one (files apply in name order, the last one wins), for example
# /etc/sysctl.d/99-zz-site-forwarding.conf.
net.ipv4.ip_forward = 0


