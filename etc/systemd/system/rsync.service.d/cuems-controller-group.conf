#
# Make rsync.service controller-only and bind its lifecycle to the
# cuems-controller.target. Activation comes from Wants=rsync.service
# in cuems-controller.target — drop-ins are not allowed to carry an
# [Install] section, systemd silently ignores it there.
#
# ConditionPathExists is the role gate: /etc/cuems/master.ip exists
# only on the controller (managed by cuems-nodeconf, operator-placed
# while nodeconf is disabled cluster-wide). On a node this skips
# silently with no error; on the controller rsync starts whenever
# the target does.
[Unit]
ConditionPathExists=/etc/cuems/master.ip
PartOf=cuems-controller.target
