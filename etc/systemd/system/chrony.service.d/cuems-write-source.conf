[Service]
# Regenerate /etc/chrony/sources.d/cuems-master.sources from
# /etc/cuems/network_map.xml on every chrony start. The `+` prefix runs
# the helper as root (overriding chrony.service's ProtectSystem=strict +
# ReadWritePaths=/run), which is required to write under /etc/.
#
# The helper itself is a no-op on the controller: it checks
# /etc/cuems/master.ip and exits 0 immediately if present. DO NOT use
# [Unit] ConditionPathExists here — that would gate the entire
# chrony.service start, preventing chrony from running on the
# controller (where it must serve slaves).
ExecStartPre=+/usr/lib/cuems/bin/cuems-write-chrony-source
