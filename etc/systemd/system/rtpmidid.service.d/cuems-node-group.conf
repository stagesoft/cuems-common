[Unit]
PartOf=cuems-node.target
# Order rtpmidid AFTER avahi-daemon so its avahi-client connects to a ready
# daemon and publishes its _apple-midi services on the first try. rtpmidid
# registers services via libavahi-client; if it starts before avahi-daemon
# (observed on cold boot: rtpmidid up ~170ms before avahi-daemon) the
# registration is deferred and — pre-fix — never committed, leaving the host
# invisible to mDNS discovery (controller then publishes nothing, nodes can't
# find its MTC export). avahi-daemon.service is Type=dbus, so After= waits
# until it owns its bus name (i.e. is ready for clients). This is the systemd
# belt; the braces is the rtpmidid mdns_rtpmidi.cpp fix that commits queued
# announcements on AVAHI_CLIENT_S_RUNNING. Safe vs the cycle warning below:
# avahi-daemon is NOT in the network.target->rtpmidid dependency chain.
Wants=avahi-daemon.service
After=avahi-daemon.service
# NOTE: do NOT add After/Wants=network-online.target here. rtpmidid ships
# WantedBy=network.target, and network-online.target is itself After=
# network.target, so ordering rtpmidid after network-online.target forms an
# ordering cycle (network.target -> network-online.target -> rtpmidid ->
# network.target) that systemd breaks by DELETING rtpmidid's start job --
# rtpmidid then silently never starts at boot. The cold-boot reachability
# guarantee is provided by the cuems-wait-controller ExecStartPre below,
# which needs no ordering edge and so introduces no cycle.

[Service]
# Raise the start timeout to cover the cuems-wait-controller bounded wait
# (default 60s) plus rtpmidid's own startup, with headroom.
TimeoutStartSec=120

# Regenerate /run/cuems/rtpmidid.ini per host role (controller vs node) before
# rtpmidid starts. Role is detected via presence of /etc/cuems/master.ip,
# the same sentinel used by every other CUEMS role-aware hook. The `+`
# prefix elevates the helper so it can write under /run/cuems regardless of
# the User= rtpmidid runs as.
ExecStartPre=+/usr/lib/cuems/bin/cuems-write-rtpmidid-config

# On nodes, block until the controller is reachable so rtpmidid's first
# RTP-MIDI discover/connect succeeds instead of racing an unconfigured
# link-local route (see cuems-wait-controller for the full rationale).
# No-op on the controller. `+` elevates it so the reachability ping works
# regardless of the User= rtpmidid runs as.
ExecStartPre=+/usr/lib/cuems/bin/cuems-wait-controller

# Reset ExecStart= and re-declare it pointing at the generated INI so we
# don't fight with /etc/rtpmidid/default.ini (which is the upstream
# rtpmidid package's conffile — dpkg would prompt on every apt upgrade
# if we ever wrote there).
ExecStart=
ExecStart=/usr/bin/rtpmidid --ini=/run/cuems/rtpmidid.ini

# Tmpfs working directory must outlive a service restart so that
# /run/cuems/rtpmidid.ini stays valid across `systemctl restart`.
RuntimeDirectory=cuems
RuntimeDirectoryMode=0755
RuntimeDirectoryPreserve=yes

[Install]
WantedBy=cuems-node.target
