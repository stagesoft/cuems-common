[Unit]
Description=systemd-journal-upload (CUEMS slave -> controller)
PartOf=cuems-node.target
# Skip on the controller. /etc/cuems/master.ip is managed by
# cuems-nodeconf based on network_map.xml::node_type (currently
# operator-placed while nodeconf is disabled cluster-wide).
ConditionPathExists=!/etc/cuems/master.ip
# NOTE: upstream's Wants= / After=network-online.target is inherited.
# Empty-reset drop-in pattern (Wants=\n After=\n) is UNRELIABLE on
# Debian 12 systemd 252 — verified 2026-05-12 with `systemctl show -p
# Wants,After`. On CUEMS nodes today, network-online.target is reached
# even with link-local-only addressing, so this dep is satisfied in
# practice. If a future node fails to reach network-online.target,
# ship a full /etc/systemd/system/systemd-journal-upload.service
# override instead (drop-in can't fix this on 252).

[Service]
# RuntimeDirectory= with DynamicUser=yes (inherited) creates
# /run/cuems-journal-upload owned by the dynamic upload user — the
# only place the ExecStartPre helper can write the URL env file
# from inside the service's process tree.
RuntimeDirectory=cuems-journal-upload
ExecStartPre=/usr/lib/cuems/bin/cuems-log-collector-url
# `-` prefix on the value: tolerate missing file. ExecStartPre creates
# it; ExecStart re-reads (systemd evaluates EnvironmentFile per Exec...
# invocation).
EnvironmentFile=-/run/cuems-journal-upload/url.env
ExecStart=
ExecStart=/lib/systemd/systemd-journal-upload --save-state -u ${URL}

[Install]
WantedBy=cuems-node.target
