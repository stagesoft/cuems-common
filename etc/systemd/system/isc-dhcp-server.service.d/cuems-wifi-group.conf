#
# This drop-in gains an ordering and a gate and NOTHING else. Dependency lists
# cannot be cleared by a later drop-in, so anything added here reaches every
# site, including the ones that manage their own AP.
[Unit]
PartOf=cuems-wifi.target
# Address first, then dhcpd, then hostapd. NEVER order dhcpd after hostapd:
# that is an ordering cycle, and systemd resolves it by silently deleting
# hostapd's start job — boot-fatal for the AP (Medina, cupula1).
After=cuems-wifi.service

[Service]
# Gate 2: skip unless an interface other than bond0 carries an address inside
# the AP subnet. On a wired boot that is a quiet skip, where until 1.3.0-22 it
# was a `failed` unit and a `degraded` system. NET_MODE=manual always passes.
ExecCondition=/usr/lib/cuems/bin/check-ip.sh dhcpd

[Install]
WantedBy=cuems-wifi.target

