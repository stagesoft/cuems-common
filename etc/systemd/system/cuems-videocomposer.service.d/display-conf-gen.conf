#
# Always-on drop-in: regenerate /run/cuems/display.conf from
# /etc/cuems/default_mappings.xml before each videocomposer start.
# Required on every host (controller and nodes) because the
# videocomposer reads /run/cuems/display.conf at init.
#
# Opt-in helpers (i915 PCI rebind, monitor DDC wake) ship as examples
# in /usr/share/cuems/cuems-videocomposer/. Copy them to
# /etc/systemd/system/cuems-videocomposer.service.d/ on hosts that
# need them — typically the controller, where the Intel TC-port
# DP/HDMI silent-failure mode requires the rebind. Most node hosts
# do not need either.

[Service]
ExecStartPre=/usr/lib/cuems/bin/cuems-generate-display-conf
