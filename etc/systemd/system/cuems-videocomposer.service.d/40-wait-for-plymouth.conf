[Unit]
# Hold VC startup until the Plymouth boot splash has quit and released DRM
# master, so VC can become DRM master and modeset.
#
# VC drives DRM/KMS directly. Early in boot the Plymouth splash (kernel cmdline
# `splash`) owns DRM master on /dev/dri/card0. If VC starts while the splash
# holds it, seatd's drmSetMaster fails with EBUSY ("Could not make device fd
# drm master: Device or resource busy"), VC falls back to render-without-
# modeset and never retries, so every modeset is denied ("Modeset failed:
# Permission denied") and the panels stay dark until VC is manually restarted.
#
# plymouth-quit-wait.service runs `plymouth --wait`, completing only once
# plymouthd has quit and dropped DRM master — exactly the barrier VC needs.
# Ordering VC after it is the canonical fix (replaces the old runtime
# ExecStartPre=plymouth --wait, which added no ordering edge but was bespoke).
#
# SAFE re: the historical ordering cycle (see the main unit's [Unit] comment):
# on Debian 12 plymouth-quit-wait.service is ordered Before=graphical.target
# (NOT Before=multi-user.target), so it sits parallel to multi-user.target and
# OUTSIDE the cuems-node.target -> multi-user.target -> graphical.target loop.
# An After= edge to it therefore cannot re-create that cycle (verified with
# `systemd-analyze verify`). The previous comment here claimed plymouth-quit-wait
# was Before=multi-user.target and would re-create the cycle — that was wrong for
# this distro.
After=plymouth-quit-wait.service
# Wants= keeps the wait effective on a non-graphical (multi-user) boot, where
# plymouth-quit-wait is not auto-pulled by graphical.target. Wants= adds no
# ordering edge, so it cannot reintroduce the cycle either.
Wants=plymouth-quit-wait.service
