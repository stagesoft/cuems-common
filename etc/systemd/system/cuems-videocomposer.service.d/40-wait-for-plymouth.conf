[Service]
# Hold VC startup until the Plymouth boot splash has quit and released DRM
# master, so VC can become DRM master and modeset.
#
# VC drives DRM/KMS directly. Early in boot the Plymouth splash (kernel cmdline
# `splash`) owns DRM master on /dev/dri/card0. If VC starts while the splash
# holds it, seatd's drmSetMaster fails with EBUSY ("Could not make device fd
# drm master: Device or resource busy"), VC falls back to render-without-
# modeset and never retries, so every modeset is denied ("Modeset failed:
# Permission denied") and the panels stay dark until VC is manually restarted.
#
# `plymouth --wait` is exactly what plymouth-quit-wait.service runs; it returns
# the instant the splash is already gone, and blocks (bounded by `timeout`)
# while it is still up. The leading `-` makes a non-zero exit non-fatal, so a
# stuck or absent splash can never wedge VC startup.
#
# Why not [Unit] After=/Wants=plymouth-quit-wait.service: that unit is ordered
# Before=multi-user.target, and an After= edge to it re-creates the
# cuems-node.target ordering cycle the main unit was rewritten to avoid (see
# the unit's [Unit] comment) — systemd breaks such cycles non-deterministically
# and has killed this unit at boot before. A runtime ExecStartPre adds no
# ordering edge, so it cannot reintroduce the cycle.
ExecStartPre=-/bin/sh -c 'timeout 30 /usr/bin/plymouth --wait'
