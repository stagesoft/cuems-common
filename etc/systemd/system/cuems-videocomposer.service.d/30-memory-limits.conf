[Service]
# Contain leaks so a runaway videocomposer cannot starve journald/sshd.
# Percentages scale with the host's physical RAM:
#   8 GB host  -> MemoryHigh 2.0 GB / MemoryMax 3.2 GB
#   16 GB host -> MemoryHigh 4.0 GB / MemoryMax 6.4 GB
# No swap (avoids dropped frames from paging during playback).
# Pairs with the unit's Restart=on-failure / RestartSec=5 so systemd respawns
# vc within ~5s after an OOM kill.
MemoryHigh=25%
MemoryMax=40%
MemorySwapMax=0
