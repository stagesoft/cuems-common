[Service]
# Override ExecStartPre to run i915 GPU rebind and display conf generation
# in the correct order, then add a post-start monitor wake step.
#
# Empty assignment clears the ExecStartPre list from the base unit first.
ExecStartPre=
ExecStartPre=+/usr/local/bin/cuems-i915-rebind.sh
ExecStartPre=/usr/lib/cuems/bin/cuems-generate-display-conf
# Wake sleeping monitors via DDC/CI 10 seconds after DRM modeset completes.
ExecStartPost=+/usr/local/bin/cuems-wake-monitors.sh
