[Unit]
Description=systemd-journal-remote (CUEMS centralized collector)
PartOf=cuems-controller.target

[Service]
# Switch from upstream HTTPS (--listen-https=-3) to plain HTTP on the
# link-local cluster. The `-3` argument keeps socket activation: the
# fd is passed from systemd-journal-remote.socket (Requires= +
# Also= in the upstream unit), which already binds :19532 on all
# interfaces. PrivateNetwork=yes inherited from upstream is fine
# precisely because the socket binds in the host namespace before
# the fd is handed in.
#
# Storage retention: systemd-journal-remote 252 has NO --max-use flag
# (verified with --help), and journal-remote.conf accepts only Seal=,
# SplitMode= and the TLS options — there is no MaxUse=/MaxFiles=/KeepFree=.
# Collected journals therefore grow until the filesystem fills. This did
# become a concern: a controller left running ~3 months reached 20 GB in
# /var/log/journal/remote (190 archived journals plus 261 *.journal~ files
# from repeated "Journal header limits reached" rotations), on top of a
# 6 GB local journal, filling /var to 83%.
#
# Now bounded from two sides:
#   * local journal   — SystemMaxUse= in journald.conf.d/cuems.conf,
#                       enforced continuously by journald
#   * collected ones  — cuems-journal-vacuum.timer (daily), since nothing
#                       in journal-remote can express a limit
# Note this is also why cuems-logs must run under sudo: the collected
# journals are 0640 systemd-journal-remote:systemd-journal-remote, and
# LogsDirectory= re-asserts that group on every start, so members of
# systemd-journal cannot read them.
ExecStart=
ExecStart=/lib/systemd/systemd-journal-remote --listen-http=-3 --output=/var/log/journal/remote/ --split-mode=host

[Install]
WantedBy=cuems-controller.target
