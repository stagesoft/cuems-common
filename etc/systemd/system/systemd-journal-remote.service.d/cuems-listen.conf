[Unit]
Description=systemd-journal-remote (CUEMS centralized collector)
PartOf=cuems-controller.target

[Service]
# Switch from upstream HTTPS (--listen-https=-3) to plain HTTP on the
# link-local cluster. The `-3` argument keeps socket activation: the
# fd is passed from systemd-journal-remote.socket (Requires= +
# Also= in the upstream unit), which already binds :19532 on all
# interfaces. PrivateNetwork=yes inherited from upstream is fine
# precisely because the socket binds in the host namespace before
# the fd is handed in.
#
# Storage retention: systemd-journal-remote 252 has NO --max-use flag
# (verified with --help); collected journals grow until the filesystem
# fills. Master /var has 60+ GB free today; revisit with a global
# SystemMaxUse= in journald.conf or a cron-based prune if growth
# becomes a concern.
ExecStart=
ExecStart=/lib/systemd/systemd-journal-remote --listen-http=-3 --output=/var/log/journal/remote/ --split-mode=host

[Install]
WantedBy=cuems-controller.target
