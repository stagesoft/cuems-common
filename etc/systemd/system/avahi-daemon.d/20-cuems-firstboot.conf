#
# A box waiting for its first boot (docs/first-boot.md) must not announce
# itself. The socket is part of basic.target, so any .local lookup would start
# the daemon. No effect on a box that is not armed.
[Unit]
ConditionPathExists=!/var/lib/cuems/firstboot.armed
