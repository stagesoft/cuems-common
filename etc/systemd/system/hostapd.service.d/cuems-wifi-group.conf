#
# DO NOT RENAME THIS FILE, and do not move any of it into 20-cuems-config.conf.
# Medina and formitgo shadow THIS name under /etc/systemd/system/ to run their
# own always-on AP; formitgo does not shadow 20-cuems-config.conf. So every
# hostapd change that must not reach those sites has to live here, and because
# this name sorts after `20-` it can reset what `20-` sets.
[Unit]
PartOf=cuems-wifi.target
# PartOf=, not Requisite= (1.3.0-23). Requisite= made hostapd FAIL ("Dependency
# failed for hostapd.service") on every boot where cuems-wifi.service was
# skipped — that is, on every wired boot. The gate is the ExecCondition below;
# PartOf= keeps the one thing Requisite= was good for: stopping the AP data
# path stops hostapd.
PartOf=cuems-wifi.service
After=cuems-wifi.service
# Reset the condition 20-cuems-config.conf sets. Conditions are checked before
# ANY Exec line runs, and /run/cuems/hostapd.conf is rendered by that file's
# own ExecStartPre=, so on a fresh boot the condition could never be true and
# hostapd could never start. It went unnoticed because Requisite= failed first.
# The render still precedes ExecStart=, which is all hostapd needs.
ConditionFileNotEmpty=

[Service]
# Gate 3: only on a wifi0 that already carries the gateway address.
ExecCondition=/usr/lib/cuems/bin/check-ip.sh hostapd
# Reset 20-cuems-config.conf's `ip link set wifi0 master bond0`: bonding
# refuses to enslave an interface that is up (EPERM), which left hostapd
# `failed` after every stop. ExecStopPost= also runs after a condition skip,
# so the helper does nothing when wifi0 is still a bond slave.
ExecStopPost=
ExecStopPost=-/usr/lib/cuems/bin/cuems-ap-path release-wifi

# Override upstream's [Install] WantedBy=multi-user.target. Empty-clear
# drops the inherited value so future `systemctl enable hostapd.service`
# writes only the cuems-wifi.target symlink — hostapd only autostarts on
# controllers (where cuems-controller.target -> cuems-wifi.target -> here).
[Install]
WantedBy=
WantedBy=cuems-wifi.target
