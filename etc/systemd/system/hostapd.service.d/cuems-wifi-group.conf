[Unit]
PartOf=cuems-wifi.target
Requisite=cuems-wifi.service
After=cuems-wifi.service

# Override upstream's [Install] WantedBy=multi-user.target. Empty-clear
# drops the inherited value so future `systemctl enable hostapd.service`
# writes only the cuems-wifi.target symlink — hostapd only autostarts on
# controllers (where cuems-controller.target -> cuems-wifi.target -> here).
[Install]
WantedBy=
WantedBy=cuems-wifi.target
