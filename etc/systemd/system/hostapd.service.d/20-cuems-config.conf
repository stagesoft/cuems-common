#
# Redirect hostapd at the rendered runtime config under /run/cuems/
# instead of /etc/hostapd/hostapd.conf. The renderer substitutes the
# SSID (derived from /etc/cuems/cluster.conf) and the WPA passphrase
# before hostapd starts.
#
# Empty-clear lines (ExecStart=, ConditionFileNotEmpty=) drop the
# values inherited from /lib/systemd/system/hostapd.service so the
# replacement takes full effect. Without the clear, systemd would
# keep the inherited ExecStart and run hostapd twice — the second
# invocation would fail on the PID file already held by the first.

[Unit]
ConditionFileNotEmpty=
ConditionFileNotEmpty=/run/cuems/hostapd.conf

[Service]
ExecStartPre=/usr/lib/cuems/bin/cuems-write-hostapd-config
ExecStart=
ExecStart=/usr/sbin/hostapd -B -P /run/hostapd.pid /run/cuems/hostapd.conf
