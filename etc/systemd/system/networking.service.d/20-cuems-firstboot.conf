#
# A box waiting for its first boot (docs/first-boot.md) configures no network:
# udev would otherwise start ifup for an allow-hotplug interface. No effect on a
# box that is not armed.
[Unit]
ConditionPathExists=!/var/lib/cuems/firstboot.armed
