#
# The physical power button on a CUEMS host is handled by systemd-logind.
#
# This package used to ship an acpid handler chain (/etc/acpi/events/powerbtn-*
# -> powerbtn-custom-handler.sh -> cuems-power-button-waiter.sh). It was dead
# code: acpid is not installed on any CUEMS host, so those files never ran, and
# the handler's first action was /usr/bin/cuems-stop — a script hardcoded to a
# long-gone venue's relay and SSH targets. Retired in 1.3.0-16.
#
# What actually happens on a press: logind sees the udev `power-switch`-tagged
# LNXPWRBN button and applies HandlePowerKey. The value below is ALREADY
# systemd's compiled-in default, so this drop-in changes no behaviour — it is
# here to make the contract explicit, because cuems-cluster-poweroff.service
# depends on a press producing an ordinary, orderly poweroff transaction rather
# than a forced one.
#
# NOT reloadable: `systemctl show systemd-logind -p CanReload` is "no" on
# bookworm's systemd 252, so an edit here takes effect at the next boot. That is
# harmless precisely because it matches the default already in force.
#
# `systemctl poweroff --force` bypasses the orderly stop of every unit, so the
# ExecStop hook does not run and the projectors and nodes stay up. That is what
# --force is for; do not use it on a controller you want shut down cleanly.

[Login]
HandlePowerKey=poweroff
