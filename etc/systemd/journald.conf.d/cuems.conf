# CUEMS journald policy. Drop-in (overrides /etc/systemd/journald.conf) so we
# never have to divert systemd's own conffile.
[Journal]
ForwardToSyslog=yes

# Cap the LOCAL journal. CUEMS services log at DEBUG by default
# (CUEMS_LOG_LEVEL is unset -> DEBUG in cuemsutils.log), and the engine
# records every MTC quarter-frame, so a controller running both engines
# plus the videocomposer produces a few hundred thousand entries a day.
# The upstream default (SystemMaxUse = 10% of the filesystem) is ~11 GB on
# a 117 GB disk, which is more history than is ever useful and crowds out
# the media library. journald enforces this continuously, so no timer is
# needed here.
#
# The journals collected FROM nodes are not covered by this: they live in
# /var/log/journal/remote/ and are written by systemd-journal-remote, which
# has no retention setting of its own on systemd 252. Those are pruned by
# cuems-journal-vacuum.timer instead.
SystemMaxUse=8G
SystemKeepFree=10G
